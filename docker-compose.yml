version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: studyforge-backend
    environment:
      STUDYFORGE_API_KEY: ${STUDYFORGE_API_KEY:-${AFE_API_KEY:-}}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: studyforge-frontend
    environment:
      STUDYFORGE_API_KEY: ${STUDYFORGE_API_KEY:-${AFE_API_KEY:-}}
    ports:
      - "80:80"
    depends_on:
      - backend
